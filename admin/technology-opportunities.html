<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMRDC Technology Opportunities Admin</title><link rel="stylesheet" href="../portal.css?v=28"><link rel="stylesheet" href="../css/research-to-industry.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <link rel="stylesheet" href="../css/layout-uniformity.css">
  <link rel="stylesheet" href="css/scroll-reveal.css">
</head><body class="portal-body"><main class="container" style="padding:32px 0"><a href="index.html">← Staff Admin</a><div style="display:flex;justify-content:space-between;align-items:end;margin-top:24px"><div><span class="v3-label">RMRDC governance layer</span><h1>Technology Opportunities</h1><p>Review, approve and submit investable technologies to selected investors.</p></div><button class="primary-btn" id="newBtn">＋ New opportunity</button></div>
<section class="v3-card" style="margin-top:18px"><table class="workflow-table"><thead><tr><th>Opportunity</th><th>Sector</th><th>TRL</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></section>
<section class="v3-card" style="margin-top:16px"><span class="v3-label">Investor requests</span><table class="workflow-table"><thead><tr><th>Type</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="requests"><tr><td colspan="4">Loading…</td></tr></tbody></table></section></main>
<div id="modal" class="gate-modal hidden"><div class="gate-box" style="max-width:760px"><h2>Technology opportunity</h2><form id="form"><input id="title" placeholder="Technology title" required><input id="sector" placeholder="Sector"><input id="trl" type="number" min="1" max="9" placeholder="TRL"><input id="summary" placeholder="Short summary"><textarea id="problem" placeholder="Problem addressed"></textarea><textarea id="technical" placeholder="Technical specifications (controlled)"></textarea><input id="materials" placeholder="Raw materials, comma separated"><input id="investment" type="number" placeholder="Estimated investment (₦)"><input id="market" type="number" placeholder="Market size (₦)"><input id="ip" placeholder="Patent / IP status"><input id="engagement" placeholder="Engagement models, comma separated"><div class="gate-actions"><button type="button" class="outline-btn" onclick="modal.classList.add('hidden')">Cancel</button><button class="primary-btn">Save draft</button></div></form></div></div>
<script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="../js/research-to-industry.js"></script><script>
(async()=>{const u=await RMRDCWorkflow.currentUser();if(!u){rows.innerHTML='<tr><td colspan="5">Please sign in through Staff Admin first.</td></tr>';return}async function load(){const r=await db.from('technology_opportunities').select('id,title,sector,trl,visibility,created_at').order('created_at',{ascending:false});rows.innerHTML=(r.data||[]).map(x=>'<tr><td>'+RMRDCWorkflow.esc(x.title)+'</td><td>'+RMRDCWorkflow.esc(x.sector||'—')+'</td><td>'+(x.trl||'—')+'</td><td>'+RMRDCWorkflow.esc(x.visibility)+'</td><td><button class="outline-btn" data-id="'+x.id+'" data-action="approve">'+(x.visibility==='approved'?'Archive':'Approve')+'</button></td></tr>').join('')||'<tr><td colspan="5">No opportunities.</td></tr>';rows.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const approved=b.textContent.trim()==='Approve';await db.from('technology_opportunities').update({visibility:approved?'approved':'archived',approved_by:approved?u.id:null,approved_at:approved?new Date().toISOString():null,published_at:approved?new Date().toISOString():null}).eq('id',id);load()})};await load();newBtn.onclick=()=>modal.classList.remove('hidden');form.onsubmit=async e=>{e.preventDefault();const split=x=>document.getElementById(x).value.split(',').map(v=>v.trim()).filter(Boolean);const {error}=await db.from('technology_opportunities').insert({title:title.value,sector:sector.value,trl:Number(trl.value)||null,short_summary:summary.value,problem_addressed:problem.value,technical_specifications:technical.value,raw_materials:split('materials'),estimated_investment:Number(investment.value)||null,market_size:Number(market.value)||null,patent_ip_status:ip.value,engagement_models:split('engagement'),created_by:u.id,visibility:'draft'});if(error)alert(error.message);else{modal.classList.add('hidden');form.reset();load()}};const rr=await db.from('investor_requests').select('id,request_type,status,created_at').order('created_at',{ascending:false}).limit(25);requests.innerHTML=(rr.data||[]).map(x=>'<tr><td>'+RMRDCWorkflow.esc(x.request_type)+'</td><td>'+RMRDCWorkflow.esc(x.status)+'</td><td>'+new Date(x.created_at).toLocaleDateString()+'</td><td><button class="outline-btn" onclick="alert(\'Use the request record in Supabase or your future admin workflow to assign/review.\')">Review</button></td></tr>').join('')||'<tr><td colspan="4">No requests.</td></tr>'})();
</script>  <script src="js/scroll-reveal.js"></script>
<script src="js/document-intelligence.js"></script><script src="js/document-registration.js"></script></body></html>
