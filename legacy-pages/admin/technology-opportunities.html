<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RMRDC Technology Opportunities Admin</title>
  <link rel="stylesheet" href="../portal.css?v=28">
  <link rel="stylesheet" href="../css/research-to-industry.css">
  <link rel="stylesheet" href="../css/layout-uniformity.css">
  <link rel="stylesheet" href="../css/scroll-reveal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="portal-body">
  <main class="container" style="padding:32px 0">
    <a href="index.html">← Staff Admin</a>
    <div style="display:flex;justify-content:space-between;align-items:end;margin-top:24px">
      <div>
        <span class="v3-label">RMRDC governance layer</span>
        <h1>Technology Opportunities</h1>
        <p>Review, approve and submit investable technologies to selected investors.</p>
      </div>
      <button class="primary-btn" id="newBtn">＋ New opportunity</button>
    </div>
    <section class="v3-card" style="margin-top:18px">
      <table class="workflow-table">
        <thead><tr><th>Opportunity</th><th>Sector</th><th>TRL</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody>
      </table>
    </section>
    <section class="v3-card" style="margin-top:16px">
      <span class="v3-label">Investor requests</span>
      <table class="workflow-table">
        <thead><tr><th>Type</th><th>Status</th><th>Created</th><th>Action</th></tr></thead>
        <tbody id="requests"><tr><td colspan="4">Loading…</td></tr></tbody>
      </table>
    </section>
  </main>
  <div id="modal" class="gate-modal hidden">
    <div class="gate-box" style="max-width:760px">
      <h2>Technology opportunity</h2>
      <form id="form">
        <input id="title" placeholder="Technology title" required>
        <input id="sector" placeholder="Sector">
        <input id="trl" type="number" min="1" max="9" placeholder="TRL">
        <input id="summary" placeholder="Short summary">
        <textarea id="problem" placeholder="Problem addressed"></textarea>
        <textarea id="technical" placeholder="Technical specifications (controlled)"></textarea>
        <input id="materials" placeholder="Raw materials, comma separated">
        <input id="investment" type="number" placeholder="Estimated investment (₦)">
        <input id="market" type="number" placeholder="Market size (₦)">
        <input id="ip" placeholder="Patent / IP status">
        <input id="engagement" placeholder="Engagement models, comma separated">
        <div class="gate-actions">
          <button type="button" class="outline-btn" id="cancelBtn">Cancel</button>
          <button class="primary-btn">Save draft</button>
        </div>
      </form>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/research-to-industry.js"></script>
  <script>
    const rows = document.getElementById('rows');
    const requests = document.getElementById('requests');
    const modal = document.getElementById('modal');
    const form = document.getElementById('form');
    const input = id => document.getElementById(id);

    (async () => {
      const user = await RMRDCWorkflow.currentUser();
      if (!user) {
        rows.innerHTML = '<tr><td colspan="5">Please sign in through Staff Admin first.</td></tr>';
        return;
      }

      async function load() {
        const result = await db.from('technology_opportunities')
          .select('id,title,sector,trl,visibility,created_at')
          .order('created_at', { ascending: false });
        if (result.error) {
          console.error('Could not load technology opportunities:', result.error);
          rows.innerHTML = '<tr><td colspan="5">Could not load opportunities. Please try again later.</td></tr>';
          return;
        }

        rows.innerHTML = (result.data || []).map(item => `
          <tr>
            <td>${RMRDCWorkflow.esc(item.title)}</td>
            <td>${RMRDCWorkflow.esc(item.sector || '—')}</td>
            <td>${item.trl || '—'}</td>
            <td>${RMRDCWorkflow.esc(item.visibility)}</td>
            <td><button class="outline-btn" data-id="${item.id}" data-action="approve">${item.visibility === 'approved' ? 'Archive' : 'Approve'}</button></td>
          </tr>
        `).join('') || '<tr><td colspan="5">No opportunities.</td></tr>';

        rows.querySelectorAll('[data-action]').forEach(button => {
          button.addEventListener('click', async () => {
            const approved = button.textContent.trim() === 'Approve';
            const now = new Date().toISOString();
            const { error } = await db.from('technology_opportunities')
              .update({
                visibility: approved ? 'approved' : 'archived',
                approved_by: approved ? user.id : null,
                approved_at: approved ? now : null,
                published_at: approved ? now : null,
              })
              .eq('id', button.dataset.id);
            if (error) {
              console.error('Could not update technology opportunity:', error);
              alert('Could not update this opportunity. Please try again later.');
              return;
            }
            await load();
          });
        });
      }

      await load();
      input('newBtn').addEventListener('click', () => modal.classList.remove('hidden'));
      input('cancelBtn').addEventListener('click', () => modal.classList.add('hidden'));
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const split = id => input(id).value.split(',').map(value => value.trim()).filter(Boolean);
        const { error } = await db.from('technology_opportunities').insert({
          title: input('title').value,
          sector: input('sector').value,
          trl: Number(input('trl').value) || null,
          short_summary: input('summary').value,
          problem_addressed: input('problem').value,
          technical_specifications: input('technical').value,
          raw_materials: split('materials'),
          estimated_investment: Number(input('investment').value) || null,
          market_size: Number(input('market').value) || null,
          patent_ip_status: input('ip').value,
          engagement_models: split('engagement'),
          created_by: user.id,
          visibility: 'draft',
        });
        if (error) {
          console.error('Could not save technology opportunity:', error);
          alert('Could not save this opportunity. Please try again later.');
          return;
        }
        modal.classList.add('hidden');
        form.reset();
        await load();
      });

      const requestResult = await db.from('investor_requests')
        .select('id,request_type,status,created_at')
        .order('created_at', { ascending: false })
        .limit(25);
      if (requestResult.error) {
        console.error('Could not load investor requests:', requestResult.error);
        requests.innerHTML = '<tr><td colspan="4">Could not load requests. Please try again later.</td></tr>';
        return;
      }
      requests.innerHTML = (requestResult.data || []).map(request => `
        <tr>
          <td>${RMRDCWorkflow.esc(request.request_type)}</td>
          <td>${RMRDCWorkflow.esc(request.status)}</td>
          <td>${new Date(request.created_at).toLocaleDateString()}</td>
          <td><button class="outline-btn" type="button" data-review="${request.id}">Review</button></td>
        </tr>
      `).join('') || '<tr><td colspan="4">No requests.</td></tr>';
      requests.querySelectorAll('[data-review]').forEach(button => {
        button.addEventListener('click', () => alert('Request review is not available here yet.'));
      });
    })().catch(error => {
      console.error('Technology opportunities admin failed to load:', error);
      rows.innerHTML = '<tr><td colspan="5">Could not load opportunities. Please try again later.</td></tr>';
    });
  </script>
  <script src="../js/scroll-reveal.js"></script>
  <script src="js/document-intelligence.js"></script>
  <script src="js/document-registration.js"></script>
  <script src="js/technology-workflow-alerts.js"></script>
</body>
</html>
