<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | RMRDC</title><link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <link rel="stylesheet" href="css/layout-uniformity.css">
  <link rel="stylesheet" href="css/scroll-reveal.css">
</head>
<body><main class="container auth-page"><section class="card auth-card centered-card">
<p class="section-tag">Account Security</p><h2>Set a new password</h2>
<p class="muted">Choose a new password with at least 8 characters.</p>
<div id="resetMessage" class="notice hidden"></div>
<form id="resetForm" class="stack-form"><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" required></div>
<div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" required></div>
<button class="btn btn-primary" type="submit">Update password</button></form>
<p class="muted"><a href="subscribe.html">Return to sign in</a></p></section></main>
<script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>
const form=document.getElementById('resetForm'), msg=document.getElementById('resetMessage');
const show=(s,e=false)=>{msg.textContent=s;msg.classList.remove('hidden');msg.classList.toggle('error',e)};
window.db?.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY') form?.classList.remove('hidden'); });
form?.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b)return show('Passwords do not match.',true);const {error}=await window.db.auth.updateUser({password:a});if(error)return show(error.message,true);show('Password updated successfully. You can now sign in.');setTimeout(()=>location.href='subscribe.html',1200)});
</script>  <script src="js/scroll-reveal.js"></script>
</body></html>
